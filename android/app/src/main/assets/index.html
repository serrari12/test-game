<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야식참기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { margin: 0; }
  [hidden] { display: none !important; }

  /* layout: single-screen fridge-glow console — one slap button center-stage,
     quote reveal as a stamped note card, tally ticking quietly in the header */
  :root {
    --bg: #eef1ee;
    --surface: #ffffff;
    --fg: #121714;
    --muted: #5c6b65;
    --accent: #ff6a3d;
    --accent-ink: #1a0d06;
    --tag-savage: #e3483f;
    --font-display: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    --font-body: 'Noto Sans KR', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1210;
      --surface: #131d19;
      --fg: #edf4f0;
      --muted: #8fa29b;
      --accent: #ff8a5c;
      --accent-ink: #160c06;
      --tag-savage: #ff6b62;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1210;
    --surface: #131d19;
    --fg: #edf4f0;
    --muted: #8fa29b;
    --accent: #ff8a5c;
    --accent-ink: #160c06;
    --tag-savage: #ff6b62;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .tally {
    font-size: 0.82rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
    border-radius: 999px;
    padding: 6px 14px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tally strong {
    color: var(--fg);
    font-weight: 700;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
  }

  .scene {
    width: 86px;
    height: 86px;
  }
  .scene svg { width: 100%; height: 100%; }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.7rem, 7vw, 2.3rem);
    line-height: 1.25;
    margin: 0;
    text-wrap: balance;
  }
  h1 .flicker { color: var(--accent); }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 0.98rem;
    max-width: 30ch;
  }

  .name-row {
    width: 100%;
    max-width: 320px;
  }
  #nameInput {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--fg) 16%, transparent);
    background: var(--surface);
    color: var(--fg);
  }
  #nameInput::placeholder { color: var(--muted); }
  #nameInput:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 1px;
  }

  .cta {
    font-family: var(--font-display);
    font-size: 1.15rem;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 16px;
    padding: 18px 30px;
    width: 100%;
    max-width: 320px;
    cursor: pointer;
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent);
    transition: transform 0.12s ease;
  }
  .cta:hover { transform: translateY(-1px); }
  .cta:active { transform: translateY(1px) scale(0.99); }
  .cta:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .quote-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
    border-radius: 18px;
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    position: relative;
  }
  .quote-card.show {
    animation: card-in 0.38s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes card-in {
    0% { opacity: 0; transform: translateY(10px) rotate(-1.5deg) scale(0.97); }
    60% { opacity: 1; transform: translateY(-2px) rotate(0.8deg) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .quote-card.show { animation: none; }
  }

  .tag {
    font-family: var(--font-display);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 4px 12px;
    border-radius: 999px;
    color: #fff;
  }
  .tag[data-kind="팩폭"] { background: var(--tag-savage); }

  .quote-text {
    margin: 0;
    font-size: 1.18rem;
    line-height: 1.55;
    font-weight: 700;
    text-wrap: balance;
    max-width: 26ch;
  }

  .actions {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 4px;
  }
  .actions button {
    flex: 1;
    min-width: 0;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.92rem;
    padding: 12px 10px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
    background: transparent;
    color: var(--fg);
  }
  #again {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }

  .giveup-msg {
    width: 100%;
    background: color-mix(in srgb, var(--tag-savage) 14%, var(--surface));
    border: 1px dashed color-mix(in srgb, var(--tag-savage) 55%, transparent);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 0.92rem;
    color: var(--fg);
    text-align: center;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="eyebrow">야식 결심 보조 장치</span>
    <span class="tally" id="tally">오늘 참음 <strong id="todayCount">0</strong>회 · 누적 <strong id="totalCount">0</strong>회</span>
  </header>

  <main>
    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 8C35 24 24 38 24 54a26 26 0 0052 0c0-16-11-30-26-46z"
          fill="color-mix(in srgb, var(--accent) 22%, transparent)"
          stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="50" cy="58" r="9" fill="var(--accent)"/>
      </svg>
    </div>

    <h1>지금 야식이<br><span class="flicker">땡긴다</span>...</h1>
    <p class="sub">눌러보세요. 누군가는 한마디 해줘야 할 때니까요.</p>

    <div class="name-row">
      <input id="nameInput" type="text" maxlength="12" placeholder="이름을 입력하면 더 따갑게 불러드려요" aria-label="이름">
    </div>

    <button class="cta" id="hitme">그래, 한마디 해봐</button>

    <div class="quote-card" id="card" hidden>
      <span class="tag" id="tag" data-kind="팩폭">팩폭</span>
      <p class="quote-text" id="quoteText"></p>
      <div class="actions">
        <button id="again">한 번 더 맞고싶다</button>
        <button id="giveup">그래도 먹을래</button>
      </div>
    </div>

    <div class="giveup-msg" id="giveupMsg" hidden></div>
  </main>

  <footer>이 순간만 넘기면, 내일 아침의 내가 고마워할 거예요.</footer>
</div>

<script>
(function () {
  var QUOTES = [
    { kind: '팩폭', text: '배고픈 게 아니라 그냥 의지가 약한 거야. 솔직히 인정해.' },
    { kind: '팩폭', text: '그 라면 하나, 오늘 운동 두 시간 한 거 전부 무효로 만든다.' },
    { kind: '팩폭', text: '지금 그거 먹으면, 어제 한 다짐은 그냥 거짓말이 되는 거야.' },
    { kind: '팩폭', text: '냉장고 열기 전에 거울부터 봐라. 그게 더 빠르다.' },
    { kind: '팩폭', text: '배고픈 거 아니고 그냥 기분이 허한 거야. 음식으로 못 채워.' },
    { kind: '팩폭', text: '야식 먹고 자면 위는 밤새 일하고, 네 각오는 밤새 죽는다.' },
    { kind: '팩폭', text: '그거 먹으면 내일 아침 거울 보고 네가 제일 먼저 실망할 거다.' },
    { kind: '팩폭', text: '몸은 거짓말을 못 해. 지금 먹은 거, 결국 다 티 난다.' },
    { kind: '팩폭', text: '습관이라고 핑계 대지 마. 습관은 네가 만든 거고, 네가 끊을 수 있는 거야.' },
    { kind: '팩폭', text: '그 한입으로 다이어트는 오늘부터 다시 1일이다. 이게 몇 번째냐.' },
    { kind: '팩폭', text: '진짜 배고픈 거면 물 마시고 버텨져. 안 버텨지면 그냥 식탐이다.' },
    { kind: '팩폭', text: '치킨 시키기 전에 작년 옷 입어봐. 안 맞으면 그 손 치워라.' },
    { kind: '팩폭', text: '지금 먹는 건 너고, 치우는 것도 내일의 너야. 떠넘기지 마.' },
    { kind: '팩폭', text: '그 돈이면 내일 더 나은 몸으로 살 수 있는데, 지금 그걸 날리는 거다.' },
    { kind: '팩폭', text: '그 숟가락 드는 순간, 오늘 다짐한 너는 그냥 사라지는 거야.' },
    { kind: '팩폭', text: '그거 시킬 돈 아껴서 내일 제대로 된 거 먹어. 지금은 그냥 낭비다.' },
    { kind: '팩폭', text: '야식 먹고 자면 얼굴 붓는 거 알면서 또 시키네.' },
    { kind: '팩폭', text: '배고픈 거 아니라 눈이 먼저 먹자고 조르는 거야. 폰 끄고 자.' },
    { kind: '팩폭', text: '그 한입이 2주치 노력을 그냥 무너뜨린다. 그게 말이 되냐.' },
    { kind: '팩폭', text: '지금 먹으면 내일 숨 차는 건 운동이 아니라 숨쉬기만 해도 그렇다.' },
    { kind: '팩폭', text: '핑계 그만 대. 배가 고픈 게 아니라 그냥 참기가 싫은 거야.' },
    { kind: '팩폭', text: '그거 먹을 시간에 물 마시고 이 닦고 누워. 그거면 끝나는 유혹이다.' },
    { kind: '팩폭', text: '진짜 배고프면 밥을 먹지, 왜 꼭 제일 살찌는 걸 고르냐.' },
    { kind: '팩폭', text: '참으면 내일 당당하고, 먹으면 내일 핑계거리 하나 더 생긴다.' },
    { kind: '팩폭', text: '살은 너한테 안 물어본다. 그냥 붙고, 넌 그제서야 후회한다.' },
    { kind: '팩폭', text: '그 5분짜리 만족이, 몇 주짜리 노력을 날린다는 거 몰라서 먹냐.' },
    { kind: '팩폭', text: '배가 아니라 마음이 허한 거다. 근데 그걸 음식으로 채우면 두 배로 빈다.' },
    { kind: '팩폭', text: '그거 먹고 자면 내일 속이, 그리고 네 멘탈이 같이 너한테 복수한다.' },
    { kind: '팩폭', text: '그 손, 어제 운동한 손 맞아? 그럼 그 손으로 숟가락부터 내려놔.' },
    { kind: '팩폭', text: '참은 오늘이 쌓여야 몸이 바뀐다. 먹은 오늘은 그냥 제자리다.' },
    { kind: '팩폭', text: '지금 안 먹어도 안 죽어. 근데 먹으면 내일 네가 죽을 맛일 거다.' },
    { kind: '팩폭', text: '떡볶이 국물까지 다 마실 생각이면 그냥 다이어트 접어라.' },
    { kind: '팩폭', text: '족발 시킬 돈으로 다음 주에 옷 한 벌 사. 그게 더 남는다.' },
    { kind: '팩폭', text: '피자 한 조각이 아니라 그 다음 세 조각까지 네가 먹을 거 다 안다.' },
    { kind: '팩폭', text: '아이스크림 반통 먹고 "이거 하나만"이라고 하지 마라. 뻔하다.' },
    { kind: '팩폭', text: '과자 한 봉지 뜯는 순간 그날 밤은 끝난 거다.' },
    { kind: '팩폭', text: '배달앱 켜는 손가락이, 다음 날 운동 가는 발걸음보다 빠르면 문제다.' },
    { kind: '팩폭', text: '지금 시킨 그거, 소화도 안 된 채로 아침 알람이 울릴 거다.' },
    { kind: '팩폭', text: '라면 국물에 밥까지 말아먹을 거면서 "조금만"이라는 말은 하지 마라.' },
    { kind: '팩폭', text: '다이어트 D-7이라며. 그 떡볶이 포장지 뜯을 자격 없다.' },
    { kind: '팩폭', text: '야식 먹고 자면 얼굴 당기는 거, 화장품 탓 아니다.' },
    { kind: '팩폭', text: '먹고 싶다는 생각이 들 때마다 참는 게 아니라 그냥 미루는 거다. 결국 똑같이 먹잖아.' },
    { kind: '팩폭', text: '치킨무 국물까지 흡입할 거면 그냥 솔직히 다이어트 안 한다고 해라.' },
    { kind: '팩폭', text: '배고픔은 10분이면 끝나는데, 네 핑계는 매일 끝이 없다.' },
    { kind: '팩폭', text: '그 늦은 시간에 배달원 호출하는 게 미안하지도 않냐. 너 몸한테도 미안해해라.' },
    { kind: '팩폭', text: '밤 11시에 먹는 밥 한 공기, 낮에 먹는 두 공기보다 더 세게 붙는다.' },
    { kind: '팩폭', text: '운동 끝나고 바로 야식 시키면 그 운동은 숫자만 채운 거다.' },
    { kind: '팩폭', text: '몸무게는 거짓말 안 한다. 어제 먹은 거, 내일 숫자로 돌려준다.' },
    { kind: '팩폭', text: '"스트레스 받아서"는 평생 핑계로 쓸 수 있는 말이 아니다.' },
    { kind: '팩폭', text: '그 매운 거 먹고 속 뒤집어지면, 그게 네 몸이 보내는 경고다.' },
    { kind: '팩폭', text: '라면 하나 끓일 시간에 샤워하고 자. 그게 내일 더 남는 장사다.' },
    { kind: '팩폭', text: '야식 먹고 바로 누우면 위만 불편한 게 아니라 다음 날 네 표정도 불편해진다.' },
    { kind: '팩폭', text: '치킨 한 마리 시켜서 "반만 먹을게"는 네 입이 들은 적 없는 말이다.' },
    { kind: '팩폭', text: '배고픈 게 아니라 손이 심심한 거다. 손 묶어놓고 폰이나 봐라.' },
    { kind: '팩폭', text: '그 야식, 내일 체중계 숫자로 바로 청구서 날아온다.' },
    { kind: '팩폭', text: '다이어트 중이라면서 장바구니에 라면부터 담는 거 누가 보는 줄 알아라.' },
    { kind: '팩폭', text: '참는 게 힘들다고? 매일 거울 보기 힘든 것보단 쉽다.' },
    { kind: '팩폭', text: '지금 배달 주문 누르는 1초가, 몇 주 노력 날리는 데 걸리는 시간이다.' },
    { kind: '팩폭', text: '밤에 먹는 건 다 살로 간다는 거, 몸이 더 잘 안다.' },
    { kind: '팩폭', text: '그 한 그릇 더 먹을 시간에 내일 입을 옷이나 다려놔라.' },
    { kind: '팩폭', text: '배고파서 먹는 게 아니라 심심해서 먹는 거면, 그냥 할 일을 찾아라.' },
    { kind: '팩폭', text: '야식 먹고 잔 다음 날 컨디션 나쁜 거, 날씨 탓하지 마라.' },
    { kind: '팩폭', text: '떡볶이 국물에 튀김 적셔 먹을 생각하는 순간 다이어트는 이미 끝났다.' },
    { kind: '팩폭', text: '그 많이 먹을 돈 모았으면 지금 몸 관리하는 데 썼어야 한다.' },
    { kind: '팩폭', text: '"오늘만 특별히"는 매일 쓰는 말 아니었냐.' },
    { kind: '팩폭', text: '배는 안 고픈데 입이 고픈 거다. 입은 참는 법을 모르니까 네가 가르쳐야 한다.' },
    { kind: '팩폭', text: '야식 한 번으로 안 죽지만, 매번 그렇게 핑계 대면 결국 포기하는 거다.' },
    { kind: '팩폭', text: '지금 먹는 그 과자 한 봉지, 내일 운동으로 다 못 뺀다.' },
    { kind: '팩폭', text: '밤에 먹고 자면 몸이 소화를 하는 게 아니라 그냥 쌓아놓는다.' },
    { kind: '팩폭', text: '그 치킨 냄새에 넘어갈 거면 애초에 배달앱을 지워라.' },
    { kind: '팩폭', text: '다이어트 핑계로 "스트레스성 폭식"이라 쓰면 네 다음 날 몸이 그 핑계를 믿어줄 거 같냐.' },
    { kind: '팩폭', text: '야식 먹는 네 모습, 내일 거울 속 네가 가장 먼저 본다.' },
    { kind: '팩폭', text: '그 많은 양을 "조금"이라고 부르는 거, 네 입만 믿는 착각이다.' },
    { kind: '팩폭', text: '지금 참으면 내일 몸이 가볍고, 먹으면 내일 핑계가 또 늘어난다.' },
    { kind: '팩폭', text: '배고픔이 아니라 지금 이 순간의 편함을 선택하는 거다. 나중은 안 편해진다.' },
    { kind: '팩폭', text: '야식 먹고 바로 자면 위산이 역류하는 거, 몸이 참다못해 보내는 신호다.' },
    { kind: '팩폭', text: '그 라면 국물 한 입이, 내일 아침 얼굴 붓기로 돌아온다.' },
    { kind: '팩폭', text: '다이어트는 의지가 아니라 습관이라면서, 지금 그 습관 다시 망치는 거다.' },
    { kind: '팩폭', text: '야식 시키는 그 순간에도 폰에는 "다이어트 1일차" 메모가 떠 있을 거다.' },
    { kind: '팩폭', text: '배고파서 먹는 거면 물 한 잔, 심심해서 먹는 거면 그냥 자라.' },
    { kind: '팩폭', text: '지금 못 참으면 평생 똑같은 자리에서 다이어트만 하게 된다.' },
    { kind: '팩폭', text: '그 늦은 시간 음식, 몸은 자야 하는데 위는 야근시키는 거다.' },
    { kind: '팩폭', text: '치킨 한 마리에 맥주까지면 그냥 오늘 다이어트는 공식적으로 포기한 거다.' },
    { kind: '팩폭', text: '"내일부터 진짜 다이어트"는 벌써 몇 번째 하는 말이냐.' },
    { kind: '팩폭', text: '배고픔은 참으면 사라지는데, 후회는 참아도 안 사라진다.' },
    { kind: '팩폭', text: '야식 먹고 잔 다음 날 거울 보면서 또 똑같은 핑계 댈 거잖아.' },
    { kind: '팩폭', text: '지금 그거 안 먹는다고 큰일 안 난다. 먹는다고 당장 행복해지는 것도 아니다.' },
    { kind: '팩폭', text: '배달 오는 시간 기다리는 그 20분, 그냥 자버리면 끝날 유혹이다.' },
    { kind: '팩폭', text: '그 야식값 모으면 한 달 뒤엔 PT 한 번 더 받을 수 있다.' },
    { kind: '팩폭', text: '다이어트 중이라면서 야식 먹는 거, 네 다짐한테 제일 미안한 일이다.' },
    { kind: '팩폭', text: '몸은 지금 쉬고 싶어 하는데, 너는 위장한테 또 일을 시키는 거다.' },
    { kind: '팩폭', text: '그 한 끼 더 먹는다고 배고픔이 완전히 사라지는 거 아니다. 습관이 더 자란다.' },
    { kind: '팩폭', text: '야식 먹고 자면 다음 날 피부도, 몸도, 기분도 다 처진다.' },
    { kind: '팩폭', text: '지금 참는 게 힘들다고 느껴지면, 그게 바로 네가 변하고 있다는 신호다.' },
    { kind: '팩폭', text: '배고파서 먹는 척하지 말고, 그냥 참기 싫어서 먹는다고 인정해라.' },
    { kind: '팩폭', text: '그 늦은 밤 한 끼가, 낮에 열심히 한 운동 두 번을 지운다.' },
    { kind: '팩폭', text: '다이어트는 저녁 7시 이후부터 시작되는데, 넌 지금 그걸 걷어차는 거다.' },
    { kind: '팩폭', text: '배고픔 참는 거보다, 매번 똑같은 핑계 듣는 네 자신이 더 지겹지 않냐.' },
    { kind: '팩폭', text: '지금 숟가락 내려놓는 게, 내일 거울 앞에서 웃는 유일한 방법이다.' },
    { kind: '팩폭', text: '참을 수 있을 때 참는 건 쉬운 다이어트다. 못 참을 때 참는 게 진짜 승부다.' }
  ];

  var GIVEUP_LINES = [
    '그래, 먹어라. 대신 내일 아침엔 핑계 대지 말기.',
    '먹는 건 네 선택이다. 다만 이 순간을 기억은 해둬.',
    '좋아, 먹어. 근데 다음엔 10분만 더 버텨보자.',
    '알겠어. 먹고, 내일은 꼭 다시 눌러봐.'
  ];

  var STORAGE_KEY = 'yasik-stopper-v1';
  var state = { total: 0, giveup: 0, today: 0, date: '', name: '' };

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (e) {}
    if (state.date !== todayStr()) {
      state.date = todayStr();
      state.today = 0;
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function renderTally() {
    document.getElementById('todayCount').textContent = state.today;
    document.getElementById('totalCount').textContent = state.total;
  }

  var lastIndex = -1;
  function pickQuote() {
    var i;
    do { i = Math.floor(Math.random() * QUOTES.length); } while (i === lastIndex && QUOTES.length > 1);
    lastIndex = i;
    return QUOTES[i];
  }

  var card = document.getElementById('card');
  var tagEl = document.getElementById('tag');
  var textEl = document.getElementById('quoteText');
  var giveupMsg = document.getElementById('giveupMsg');
  var nameInput = document.getElementById('nameInput');

  function showQuote(countsAsResist) {
    giveupMsg.hidden = true;
    var q = pickQuote();
    tagEl.textContent = q.kind;
    tagEl.setAttribute('data-kind', q.kind);
    var prefix = state.name ? state.name + '님아, ' : '';
    textEl.textContent = prefix + q.text;
    card.hidden = false;
    card.classList.remove('show');
    void card.offsetWidth;
    card.classList.add('show');

    if (countsAsResist) {
      state.today += 1;
      state.total += 1;
      saveState();
      renderTally();
    }
  }

  document.getElementById('hitme').addEventListener('click', function () {
    showQuote(true);
  });
  document.getElementById('again').addEventListener('click', function () {
    showQuote(true);
  });
  document.getElementById('giveup').addEventListener('click', function () {
    state.giveup += 1;
    saveState();
    card.hidden = true;
    giveupMsg.hidden = false;
    giveupMsg.textContent = GIVEUP_LINES[Math.floor(Math.random() * GIVEUP_LINES.length)];
  });

  loadState();
  renderTally();
  nameInput.value = state.name || '';
  nameInput.addEventListener('input', function () {
    state.name = nameInput.value.trim();
    saveState();
  });
})();
</script>
</body>
</html>
