apply plugin: 'com.android.application'

android {
    namespace 'com.yasik.stopper'
    compileSdk 34

    defaultConfig {
        applicationId "com.yasik.stopper"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
